<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>CloudNote Lite</title>

<meta name="theme-color" content="#2563eb">

<link
rel="manifest"
href="manifest.json">

<link
rel="stylesheet"
href="style.css">

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

</head>

<body>

<!-- LOADING -->

<div id="loadingPage">

<div class="loader"></div>

<p>

Memuat CloudNote...

</p>

</div>

<!-- LOGIN -->

<section
id="loginPage"
class="page">

<div class="loginCard">

<div class="logo">

☁

</div>

<h1>

CloudNote Lite

</h1>

<p>

Catatan Online
Ringan &
Sinkron

</p>

<input

id="roomInput"

type="text"

placeholder="Nama Ruang">

<input

id="pinInput"

type="password"

maxlength="6"

placeholder="PIN">

<button

id="loginBtn">

Masuk

</button>

</div>

</section>

<!-- HOME -->

<section

id="homePage"

class="page hidden">

<header>

<div>

<h2>

☁ CloudNote

</h2>

<small

id="roomLabel">

-

</small>

</div>

<div>

<button

id="themeBtn">

🌙

</button>

</div>

</header>

<div class="searchArea">

<input

id="searchInput"

placeholder="Cari catatan...">

</div>

<div

id="noteContainer">

<!-- nanti javascript -->

</div>

<button

id="addBtn">

+

</button>

</section>

<!-- EDITOR -->

<section

id="editorPage"

class="hidden">

<div

class="editorCard">

<h2>

Catatan

</h2>

<input

id="titleInput"

placeholder="Judul">

<textarea

id="contentInput"

placeholder="Isi catatan...">

</textarea>

<div class="editorButton">

<button

id="cancelBtn">

Batal

</button>

<button

id="saveBtn">

Simpan

</button>

</div>

</div>

</section>
